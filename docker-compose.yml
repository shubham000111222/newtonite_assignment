services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newtonite
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d newtonite"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: sh startup.sh
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/newtonite
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build: .
    command: npm run dev -w worker
    environment:
      DATABASE_URL: postgres://postgres:password@postgres:5432/newtonite
    depends_on:
      api:
        condition: service_healthy

  web:
    build: .
    command: npm run dev -w web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      HOST: 0.0.0.0

volumes:
  pgdata:
